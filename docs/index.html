<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hello World | GitHub Pages Sample</title>
  <link rel="icon" type="image/svg+xml" href="images/favicon.svg">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="hero">
    <img src="images/hero.svg" alt="Hello World イラスト" class="hero-image">
    <h1 id="greeting">Hello, Japan!</h1>
    <p class="subtitle">GitHub Pages 動作確認用サンプルページ（docs/ フォルダから公開）</p>
  </header>

  <main>
    <section class="card">
      <h2>挨拶を切り替えてみよう</h2>
      <p id="output" class="output">ボタンを押すと世界の挨拶が表示されます。</p>
      <button id="greetBtn" type="button">次の挨拶へ ➜</button>
    </section>

    <section class="card">
      <h2>このサイトについて</h2>
      <ul>
        <li><code>docs/</code> フォルダを GitHub Pages の公開元（Source）として使用しています。</li>
        <li>画像は <code>docs/images/</code> フォルダにまとめています。</li>
        <li><code>script.js</code> による簡易的なインタラクションを実装しています。</li>
      </ul>
    </section>
  </main>

  <footer>
    <p>&copy; 2026 TaskFlow Project</p>
  </footer>

  <script src="script.js"></script>
</body>
</html>
